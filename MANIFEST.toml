name = "Classical Works"
description = "Tags classical music from MusicBrainz works: right-click files to find a work, or retag releases automatically."
api = ["3.0"]
version = "0.2.0"
license = "GPL-2.0-or-later"
license_url = "https://www.gnu.org/licenses/gpl-2.0.html"
categories = ["metadata"]
long_description = """
Tags classical music around the MusicBrainz work instead of the recorded
release: composer as artist, work as album, movement as title, composition
date, key, opus, work type as genre, movement number as track number.

Right-click files or a cluster and choose "Find MusicBrainz work...": search
for the work, check which movement each file is, and apply. No release needed,
so it works for any recording, including ones that are not on MusicBrainz.

When files are matched to a release whose recordings are linked to works
(with "Use track relationships" on), the tracks are retagged the same way
automatically, keeping the release values in release_* tags.

Requires Picard 3.0.3 or newer.
"""
